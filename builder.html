<section class="hero">

<h1>🤖 AI Builder</h1>

<h2>Create Roblox Ideas With AI</h2>

<p>
Generate game concepts, scripts, maps, and mechanics.
</p>



<div class="card">

<h2>🎮 Describe Your Game</h2>


<textarea id="prompt"
placeholder="Example: Create a Roblox football game with ranks, tournaments, and abilities..."
style="
width:100%;
height:130px;
border-radius:15px;
padding:15px;
font-size:16px;
">
</textarea>


<br><br>


<button onclick="generateAI()">
🚀 Generate
</button>


<div class="result" id="result">
Your AI creation will appear here...
</div>


</div>


</section>



<footer>

<p>
RBLX Forge is a fan-made Roblox creator toolkit.
</p>

</footer>



<script>

async function generateAI(){


let prompt = document.getElementById("prompt").value;

let result = document.getElementById("result");


if(prompt.trim() === ""){

result.innerHTML = "⚠️ Enter a Roblox idea first!";

return;

}


result.innerHTML = "🤖 RBLX Forge AI is creating...";


try{


let response = await fetch(
https://blue-star-5ffe.stavropolo444.workers.dev/
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
prompt:prompt
})

});


let data = await response.json();


result.innerHTML = data.answer;


}

catch(error){

console.log(error);

result.innerHTML =
"❌ Failed to connect to AI Worker";

}


}

</script>
