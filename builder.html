<h1>🤖 RBLX Forge AI Builder</h1>

<p>Create Roblox game ideas with AI.</p>



<h2>🎮 AI Game Generator</h2>


<input 
id="gameInput" 
placeholder="Example: Make a touch football game">


<br><br>


<button onclick="generateGame()">
Generate 🚀
</button>


<h3>AI Result:</h3>

<p id="result">
Your AI idea will appear here...
</p>



<hr>



<h2>💡 Quick Ideas</h2>

<ul>

<li>Game ideas</li>

<li>Maps</li>

<li>Stories</li>

<li>Gamepasses</li>

<li>Features</li>

</ul>



<footer>

🔥 RBLX Forge AI

</footer>




<script>

async function generateGame(){


let prompt = document.getElementById("gameInput").value;


let result = document.getElementById("result");


if(prompt === ""){

result.innerHTML = "❌ Type an idea first!";

return;

}



result.innerHTML = "🤖 AI is thinking...";



let response = await fetch(

https://blue-star-5ffe.stavropolo444.workers.dev/

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

prompt: prompt

})

}

);



let data = await response.json();



result.innerHTML = data.answer;



}


</script>
