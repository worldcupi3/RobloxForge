<!DOCTYPE html>
<html>
<head>
<title>RBLX Forge - Roblox Tools</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1020;
    color:white;
    text-align:center;
}

header{
    padding:30px;
    background:#111827;
}

h1{
    font-size:40px;
    color:#00d9ff;
}

.card{
    background:#1f2937;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    width:350px;
    box-shadow:0 0 20px #000;
}

button{
    background:#00d9ff;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    transform:scale(1.05);
}

.result{
    margin-top:15px;
    background:#111827;
    padding:10px;
    border-radius:10px;
    word-break:break-all;
}

footer{
    margin-top:40px;
    padding:20px;
    color:#aaa;
}
</style>

</head>

<body>

<header>
<h1>🔥 RBLX Forge 🔥</h1>
<p>The ultimate Roblox creator toolkit</p>
</header>


<div class="card">

<h2>🎮 Username Generator</h2>

<button onclick="generateName()">Generate</button>

<div class="result" id="name">
-
</div>

</div>


<div class="card">

<h2>🔐 Password Generator</h2>

<button onclick="generatePass()">Generate</button>

<div class="result" id="pass">
-
</div>

</div>


<div class="card">

<h2>💡 Game Idea Generator</h2>

<button onclick="idea()">Generate Idea</button>

<div class="result" id="game">
-
</div>

</div>


<footer>
Made by a Roblox creator ❤️
</footer>


<script>

let names=[
"Shadow","Nova","Void",
"Pixel","Cyber","Apex",
"Storm","Legend","Ghost"
];

let endings=[
"Wolf","Titan","Dragon",
"Raptor","King","Blade"
];


function generateName(){

let x=
names[Math.floor(Math.random()*names.length)] +
endings[Math.floor(Math.random()*endings.length)] +
Math.floor(Math.random()*9999);

document.getElementById("name").innerHTML=x;

}


function generatePass(){

let chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";

let p="";

for(let i=0;i<16;i++){
p+=chars[Math.floor(Math.random()*chars.length)];
}

document.getElementById("pass").innerHTML=p;

}


function idea(){

let ideas=[
"Escape The Haunted Roblox City",
"Build Your Own Mega Tycoon",
"Ultimate Parkour Challenge",
"Battle Royale Arena",
"Pet Collection Simulator"
];

document.getElementById("game").innerHTML=
ideas[Math.floor(Math.random()*ideas.length)];

}

</script>

</body>
</html>
